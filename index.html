<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>비행기 요격 게임</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
  canvas { border: 2px solid #0ff; box-shadow: 0 0 24px #0ff5; display: block;
           max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="480" height="680"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── 입력 ────────────────────────────────────────────────
const KEY = {};
document.addEventListener('keydown', e => {
  KEY[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => KEY[e.code] = false);

// ─── 터치 입력 ───────────────────────────────────────────
function getTouchCanvasPos(touch) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (touch.clientX - r.left) * (W / r.width),
    y: (touch.clientY - r.top)  * (H / r.height),
  };
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const pos = getTouchCanvasPos(e.touches[0]);

  // 타이틀 → 게임 시작
  if (state === 'title') {
    touchPos = null;
    initGame();
    state = 'play';
    return;
  }
  // 클리어/오버 → 타이틀
  if (state === 'clear' || state === 'over') {
    state = 'title';
    player = null;
    touchPos = null;
    return;
  }
  // 게임 중: 폭탄 버튼 영역 탭
  if (state === 'play' && powerups && powerups.bomb) {
    if (Math.hypot(pos.x - (W-38), pos.y - (H-46)) < 32) {
      useBomb();
      return;
    }
  }
  // 두 손가락 탭 = 폭탄
  if (e.touches.length >= 2 && powerups && powerups.bomb) {
    useBomb();
    return;
  }
  touchPos = pos;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchPos = getTouchCanvasPos(e.touches[0]);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (e.touches.length === 0) touchPos = null;
  else touchPos = getTouchCanvasPos(e.touches[0]);
}, { passive: false });

// ─── 전역 ────────────────────────────────────────────────
let state, frame, score, lives;
let combo, comboTimer;
let player, bullets, enemies, particles, drops, boss;
let shootCooldown, enemyTimer, stateTimer;
let powerups, stars;
let villainKills;
let touchPos = null; // 터치 위치

// ─── 빌런 4인방 정의 ─────────────────────────────────────
const VILLAINS = [
  { type:'junseob',   w:40, h:42, hp:6, maxHp:6, speed:0.55, score:200, color:'#ff6600', label:'정준섭', isVillain:true },
  { type:'sangsu',    w:40, h:42, hp:6, maxHp:6, speed:0.60, score:200, color:'#00dd44', label:'김상수', isVillain:true },
  { type:'mihee',     w:40, h:42, hp:6, maxHp:6, speed:0.50, score:200, color:'#ff44cc', label:'고미희', isVillain:true },
  { type:'hyunkyung', w:40, h:42, hp:6, maxHp:6, speed:0.58, score:200, color:'#44aaff', label:'이현경', isVillain:true },
];

// ─── 일반 적 ─────────────────────────────────────────────
const ENEMY_CFG = {
  fighter: { w:28, h:30, hp:1, maxHp:1, speed:1.8, score:10, color:'#f44' },
  drone:   { w:24, h:26, hp:1, maxHp:1, speed:3.0, score:15, color:'#f80' },
  bomber:  { w:40, h:36, hp:4, maxHp:4, speed:0.9, score:30, color:'#a0f' },
};

// ─── 파워업 ───────────────────────────────────────────────
const DROP_DEFS = [
  { id:'rapid',  label:'속사', color:'#f80', dur:550 },
  { id:'triple', label:'3연발', color:'#ff0', dur:480 },
  { id:'shield', label:'실드', color:'#0ff', dur:420 },
  { id:'speed',  label:'가속', color:'#0f8', dur:500 },
  { id:'life',   label:'1UP',  color:'#f0f', dur:0   },
  { id:'bomb',   label:'폭탄', color:'#f44', dur:0   },
];

// ─── 초기화 ──────────────────────────────────────────────
function initGame() {
  frame = 0; score = 0; lives = 3;
  combo = 0; comboTimer = 0; villainKills = 0;
  stars = Array.from({length:110}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    s: Math.random()*1.5+0.3, v: Math.random()*1.5+0.5,
  }));
  player = { x: W/2, y: H-80, w:36, h:40, speed:5, inv:0 };
  bullets=[]; enemies=[]; particles=[]; drops=[];
  boss=null; shootCooldown=0; enemyTimer=0;
  powerups = { rapid:0, triple:0, shield:0, speed:0, bomb:false };

  // ★ 빌런 4대 동시 등장 (화면 위에서 간격 맞춰 진입)
  VILLAINS.forEach((v, i) => {
    enemies.push({
      ...v,
      flash: 0,
      x: 70 + i * 115,
      y: -50 - i * 35,
      vx: (i % 2 === 0 ? 0.5 : -0.5),
      vy: v.speed,
    });
  });
}

// ─── 유틸 ────────────────────────────────────────────────
function rect(a, b) {
  return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2;
}
function explode(x, y, color, n=14) {
  for (let i=0; i<n; i++) {
    const a = (Math.PI*2/n)*i + Math.random()*0.5;
    const v = 1.5 + Math.random()*3;
    particles.push({ x, y, color, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      r:2+Math.random()*5, life:40+Math.random()*20, maxLife:60 });
  }
}

// ─── 적 스폰 ─────────────────────────────────────────────
const ENEMY_TYPES = ['fighter','fighter','fighter','drone','drone','bomber'];
function spawnEnemy() {
  const type = ENEMY_TYPES[Math.floor(Math.random()*ENEMY_TYPES.length)];
  const base = { ...ENEMY_CFG[type] };
  enemies.push({
    type, ...base, flash:0,
    x: base.w/2 + Math.random()*(W-base.w),
    y: -base.h/2,
    vx: (Math.random()-0.5)*1.6,
  });
}

// ─── 폭탄 ────────────────────────────────────────────────
function useBomb() {
  if (!powerups.bomb) return;
  powerups.bomb = false;
  for (const e of enemies) if (!e.isVillain) explode(e.x, e.y, e.color, 8);
  enemies = enemies.filter(e => e.isVillain);
  explode(W/2, H/2, '#ff0', 50);
}

// ─── 드롭 ────────────────────────────────────────────────
function tryDrop(x, y) {
  if (Math.random() > 0.25) return;
  const d = DROP_DEFS[Math.floor(Math.random()*DROP_DEFS.length)];
  drops.push({ x, y, ...d, w:20, h:20, vy:1.6, life:280 });
}

// ─── 업데이트 ────────────────────────────────────────────
function update() {
  frame++;
  for (const s of stars) { s.y += s.v; if (s.y > H) s.y = 0; }
  if (comboTimer > 0) comboTimer--; else combo = 0;

  if (state === 'title') {
    if (KEY['Enter'] || KEY['Space']) {
      KEY['Enter'] = KEY['Space'] = false;
      initGame(); state = 'play';
    }
    return;
  }
  if (state === 'dead') {
    stateTimer--;
    if (stateTimer <= 0) { player.inv = 180; state = 'play'; }
    return;
  }
  if (state === 'clear' || state === 'over') {
    if (KEY['Enter']) { KEY['Enter'] = false; state = 'title'; player = null; }
    return;
  }

  // ── PLAY ───────────────────────────────────────────────
  const spd = player.speed + (powerups.speed > 0 ? 2.2 : 0);

  // 키보드 이동
  if ((KEY['ArrowLeft']||KEY['KeyA']) && player.x > player.w/2)     player.x -= spd;
  if ((KEY['ArrowRight']||KEY['KeyD']) && player.x < W-player.w/2)  player.x += spd;
  if ((KEY['ArrowUp']||KEY['KeyW']) && player.y > H*0.3)            player.y -= spd;
  if ((KEY['ArrowDown']||KEY['KeyS']) && player.y < H-player.h/2)   player.y += spd;

  // 터치 이동: 손가락 위치로 부드럽게 따라감
  if (touchPos) {
    const dx = touchPos.x - player.x;
    const dy = touchPos.y - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 6) {
      player.x += (dx / dist) * Math.min(spd * 1.4, dist);
      player.y += (dy / dist) * Math.min(spd * 1.4, dist);
    }
    // 화면 경계 클램프
    player.x = Math.max(player.w/2, Math.min(W-player.w/2, player.x));
    player.y = Math.max(H*0.3, Math.min(H-player.h/2, player.y));
  }

  if (player.inv > 0) player.inv--;

  if ((KEY['KeyZ']||KEY['KeyX']) && powerups.bomb) {
    KEY['KeyZ'] = KEY['KeyX'] = false; useBomb();
  }
  for (const k of ['rapid','triple','shield','speed']) if (powerups[k]>0) powerups[k]--;

  // ★ 자동 발사 (키보드 Space 또는 자동)
  if (shootCooldown > 0) shootCooldown--;
  if (shootCooldown === 0) {
    const cd = powerups.rapid > 0 ? 4 : 10;
    bullets.push({ x:player.x, y:player.y-player.h/2, w:4, h:14, vy:-13, owner:'player' });
    if (powerups.triple > 0) {
      bullets.push({ x:player.x-14, y:player.y-22, w:3, h:10, vy:-12, vx:-1.2, owner:'player', color:'#8ff' });
      bullets.push({ x:player.x+14, y:player.y-22, w:3, h:10, vy:-12, vx: 1.2, owner:'player', color:'#8ff' });
    }
    shootCooldown = cd;
  }

  bullets = bullets.filter(b => {
    b.x += b.vx||0; b.y += b.vy;
    return b.y > -40 && b.y < H+40 && b.x > -40 && b.x < W+40;
  });

  // 일반 적 스폰
  enemyTimer++;
  if (enemyTimer >= 70) { spawnEnemy(); enemyTimer = 0; }

  // 적 이동
  for (const e of enemies) {
    e.x += e.vx||0;
    if (e.isVillain) {
      // 빌런은 화면 안에서 천천히 돌아다님
      e.y += e.vy;
      if (e.y < 50)      e.vy =  Math.abs(e.vy);
      if (e.y > H * 0.68) e.vy = -Math.abs(e.vy);
    } else {
      e.y += e.speed;
    }
    if (e.x < e.w/2 || e.x > W-e.w/2) e.vx = -(e.vx||0);
    if (e.flash > 0) e.flash--;
  }
  // 일반 적만 화면 밖 제거 (빌런은 유지)
  enemies = enemies.filter(e => e.isVillain || e.y < H+80);

  for (const d of drops) { d.y += d.vy; d.life--; }
  drops = drops.filter(d => d.y < H+40 && d.life > 0);

  // ── 충돌 ────────────────────────────────────────────────
  const remB = new Set(), remE = new Set();
  for (let bi=0; bi<bullets.length; bi++) {
    const b = bullets[bi];
    if (b.owner !== 'player') continue;
    for (let ei=0; ei<enemies.length; ei++) {
      if (remE.has(ei)) continue;
      const e = enemies[ei];
      if (!rect(b, e)) continue;
      remB.add(bi); e.hp--; e.flash = 6;
      if (e.hp <= 0) {
        remE.add(ei);
        explode(e.x, e.y, e.color, e.isVillain ? 25 : 14);
        tryDrop(e.x, e.y);
        combo++; comboTimer = 100;
        score += e.score * Math.max(1, 1 + Math.floor(combo/5));
        if (e.isVillain) {
          villainKills++;
          if (villainKills >= 4) {
            state = 'clear'; stateTimer = 300;
            return;
          }
        }
      }
      break;
    }
  }
  bullets  = bullets.filter((_,i) => !remB.has(i));
  enemies  = enemies.filter((_,i) => !remE.has(i));

  // 플레이어 피격
  if (player.inv === 0 && powerups.shield === 0) {
    let hit = false;
    for (const e of enemies) if (rect(player,e)) { hit=true; break; }
    if (!hit) for (const b of bullets) if (b.owner!=='player' && rect(player,b)) { hit=true; break; }
    if (hit) {
      explode(player.x, player.y, '#0cf', 22);
      lives--;
      if (lives <= 0) { state='over'; return; }
      player.x=W/2; player.y=H-80;
      state='dead'; stateTimer=70;
    }
  }

  // 드롭 수집
  for (let i=drops.length-1; i>=0; i--) {
    const d = drops[i];
    if (rect(player,d)) {
      if      (d.id==='life')  { if (lives<5) lives++; }
      else if (d.id==='bomb')  { powerups.bomb = true; }
      else powerups[d.id] = d.dur;
      explode(d.x, d.y, d.color, 8);
      drops.splice(i,1);
    }
  }

  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

// ─── 그리기 ──────────────────────────────────────────────
function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha = 0.25 + s.s*0.25;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(frame/4)%2===0) return;
  ctx.save();
  ctx.translate(p.x, p.y);

  if (powerups.shield > 0) {
    ctx.strokeStyle = `hsl(${frame*6%360},100%,70%)`;
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.55 + Math.sin(frame*0.25)*0.3;
    ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#0cf';
  ctx.beginPath();
  ctx.moveTo(0,-p.h/2); ctx.lineTo(-p.w/2,p.h/2);
  ctx.lineTo(-p.w/6,p.h/3); ctx.lineTo(0,p.h/2-8);
  ctx.lineTo(p.w/6,p.h/3); ctx.lineTo(p.w/2,p.h/2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7ef';
  ctx.beginPath(); ctx.ellipse(0,-4,6,10,0,0,Math.PI*2); ctx.fill();
  const fl = 12+Math.random()*9;
  ctx.fillStyle = `hsl(${25+Math.random()*25},100%,60%)`;
  ctx.beginPath();
  ctx.moveTo(-7,p.h/2); ctx.lineTo(7,p.h/2); ctx.lineTo(0,p.h/2+fl); ctx.closePath(); ctx.fill();
  if (powerups.rapid>0) {
    ctx.strokeStyle='#f80'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-p.w/2,-p.h/4); ctx.lineTo(p.w/2,-p.h/4); ctx.stroke();
  }

  // ★ 봉봉이 이름 태그
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(-32, -p.h/2-20, 64, 16);
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('봉봉이 ←', 0, -p.h/2-12);
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  // 빌런 발광 효과
  if (e.isVillain) {
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 12 + Math.sin(frame*0.1)*4;
  }

  ctx.fillStyle = e.flash>0 ? '#fff' : e.color;
  ctx.beginPath();
  ctx.moveTo(0,e.h/2); ctx.lineTo(-e.w/2,-e.h/2);
  ctx.lineTo(-e.w/6,-e.h/4); ctx.lineTo(0,-e.h/2+8);
  ctx.lineTo(e.w/6,-e.h/4); ctx.lineTo(e.w/2,-e.h/2);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  // HP 바 (빌런 + 폭격기)
  if (e.isVillain || e.type==='bomber') {
    ctx.fillStyle='#222'; ctx.fillRect(-e.w/2, e.h/2+2, e.w, 5);
    ctx.fillStyle = e.color; ctx.fillRect(-e.w/2, e.h/2+2, e.w*(e.hp/e.maxHp), 5);
  }

  // ★ 빌런 이름 태그
  if (e.label) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(-e.w/2-2, -e.h/2-20, e.w+4, 17);
    ctx.fillStyle = e.flash>0 ? '#fff' : e.color;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e.label, 0, -e.h/2-12);
  }
  ctx.restore();
}

function drawBullet(b) {
  ctx.save();
  ctx.shadowColor = b.color||'#ff0'; ctx.shadowBlur=10;
  ctx.fillStyle = b.color||'#ff0';
  ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
  ctx.restore();
}

function drawDrop(d) {
  ctx.save();
  ctx.globalAlpha = Math.min(1, d.life/50);
  ctx.shadowColor=d.color; ctx.shadowBlur=14;
  ctx.fillStyle=d.color;
  ctx.beginPath(); ctx.arc(d.x,d.y,10,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#000'; ctx.font='bold 8px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(d.label, d.x, d.y);
  ctx.restore();
}

function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha=p.life/p.maxLife;
  ctx.fillStyle=p.color;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawHUD() {
  // 상단 빌런 진행
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,22);
  ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ff0';
  ctx.fillText(`빌런 격추: ${villainKills} / 4`, W/2, 11);

  // 빌런별 생존 표시
  const vStates = VILLAINS.map(v => enemies.some(e => e.label === v.label));
  vStates.forEach((alive, i) => {
    const vx = 20 + i * 110;
    ctx.fillStyle = alive ? VILLAINS[i].color : '#333';
    ctx.globalAlpha = alive ? 1 : 0.4;
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(VILLAINS[i].label, vx + 35, 11);
    ctx.globalAlpha = 1;
  });

  // 하단 HUD
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,H-20,W,20);
  ctx.font='12px Courier New'; ctx.textBaseline='middle';
  ctx.fillStyle='#0ff'; ctx.textAlign='left';
  ctx.fillText('봉봉이의 복수', 8, H-10);
  ctx.fillStyle='#ff0'; ctx.textAlign='center';
  ctx.fillText(`SCORE: ${score.toLocaleString()}`, W/2, H-10);
  ctx.fillStyle='#f88'; ctx.textAlign='right';
  ctx.fillText('♥'.repeat(lives)+'♡'.repeat(Math.max(0,5-lives)), W-8, H-10);

  // 콤보
  if (combo >= 3) {
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`bold ${14+Math.min(combo,12)}px Courier New`;
    ctx.fillStyle=`hsl(${60-combo*4},100%,65%)`;
    ctx.globalAlpha=Math.min(1, comboTimer/40);
    ctx.fillText(`× ${combo} COMBO!`, W/2, H/2-50);
    ctx.restore();
  }

  // 파워업 아이콘
  let px=8; const puY=H-36;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='9px Courier New';
  for (const {id,label,color,dur} of DROP_DEFS.slice(0,4)) {
    if (powerups[id]>0) {
      const ratio = powerups[id]/dur;
      ctx.fillStyle=color; ctx.globalAlpha=0.75;
      ctx.fillRect(px,puY-7,38,14);
      ctx.fillStyle='#0002'; ctx.fillRect(px,puY-7,38*(1-ratio),14);
      ctx.fillStyle='#000'; ctx.globalAlpha=1;
      ctx.fillText(label, px+19, puY);
      px+=42;
    }
  }
  if (powerups.bomb) {
    ctx.fillStyle='#f44'; ctx.globalAlpha=0.8;
    ctx.fillRect(px,puY-7,44,14);
    ctx.fillStyle='#fff'; ctx.globalAlpha=1;
    ctx.fillText('Z:폭탄', px+22, puY);

    // 모바일용 폭탄 버튼 (우하단 큰 버튼)
    ctx.fillStyle='rgba(255,60,60,0.75)'; ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(W-38, H-46, 26, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(W-38, H-46, 26, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💣폭탄', W-38, H-46);
  }
  ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
}


// ─── 전체 draw ────────────────────────────────────────────
function draw() {
  ctx.fillStyle='#050510';
  ctx.fillRect(0,0,W,H);
  drawStars();

  if (state==='title') {
    ctx.textAlign='center';
    ctx.shadowColor='#0ff'; ctx.shadowBlur=22;
    ctx.fillStyle='#0ff'; ctx.font='bold 42px Courier New';
    ctx.fillText('비행기 요격', W/2, H/2-90);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ff0'; ctx.font='bold 18px sans-serif';
    ctx.fillText('봉봉이의 복수극', W/2, H/2-48);

    // 빌런 소개
    ctx.font='14px sans-serif';
    VILLAINS.forEach((v,i) => {
      ctx.fillStyle = v.color;
      ctx.fillText(`${v.label}  을(를) 격추하라!`, W/2, H/2+i*26);
    });

    ctx.fillStyle='#aaa'; ctx.font='13px Courier New';
    ctx.fillText('방향키이동  Space발사  Z폭탄', W/2, H/2+120);
    if (Math.floor(frame/22)%2) {
      ctx.fillStyle='#ff0'; ctx.font='bold 20px Courier New';
      ctx.fillText('[ Enter / Space ] 시작', W/2, H/2+152);
    }
    return;
  }

  for (const p of particles) drawParticle(p);
  for (const d of drops) drawDrop(d);
  for (const b of bullets) drawBullet(b);
  for (const e of enemies) drawEnemy(e);
  if (player) drawPlayer();
  drawHUD();

  if (state==='dead') {
    ctx.fillStyle='rgba(255,30,30,0.28)'; ctx.fillRect(0,0,W,H);
  }

  // ★ 클리어 화면 "신용산으로 모여 !"
  if (state==='clear') {
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';

    // 반짝이는 배경 별 효과
    for (let i=0; i<8; i++) {
      const a = (Math.PI*2/8)*i + frame*0.03;
      const r = 80 + Math.sin(frame*0.05)*20;
      ctx.fillStyle=`hsl(${frame*3+i*45},100%,60%)`;
      ctx.globalAlpha=0.5;
      ctx.beginPath(); ctx.arc(W/2+Math.cos(a)*r, H/2+Math.sin(a)*r*0.5, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    ctx.shadowColor='#ff0'; ctx.shadowBlur=30;
    ctx.fillStyle='#ff0';
    ctx.font='bold 52px sans-serif';
    ctx.fillText('신용산으로 모여 !', W/2, H/2-30);
    ctx.shadowBlur=0;

    ctx.fillStyle='#0ff'; ctx.font='20px Courier New';
    ctx.fillText(`점수: ${score.toLocaleString()}`, W/2, H/2+36);
    ctx.fillStyle='#f88'; ctx.font='14px Courier New';
    ctx.fillText('빌런 4인방 전원 격추 완료!', W/2, H/2+68);
    ctx.fillStyle='#aaa';
    ctx.fillText('[ Enter ] 타이틀', W/2, H/2+102);
    return;
  }

  if (state==='over') {
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.shadowColor='#f44'; ctx.shadowBlur=20;
    ctx.fillStyle='#f44'; ctx.font='bold 50px Courier New';
    ctx.fillText('GAME OVER', W/2, H/2-50);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ff0'; ctx.font='22px Courier New';
    ctx.fillText(`점수: ${score.toLocaleString()}`, W/2, H/2+10);
    ctx.fillStyle='#aaa'; ctx.font='15px Courier New';
    ctx.fillText(`빌런 격추: ${villainKills}/4`, W/2, H/2+46);
    ctx.fillStyle='#0ff'; ctx.fillText('[ Enter ] 타이틀', W/2, H/2+82);
  }
}

// ─── 루프 ─────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }

frame=0;
stars = Array.from({length:110}, ()=>({
  x:Math.random()*W, y:Math.random()*H,
  s:Math.random()*1.5+0.3, v:Math.random()*1.5+0.5,
}));
bullets=[]; enemies=[]; particles=[]; drops=[];
powerups={rapid:0,triple:0,shield:0,speed:0,bomb:false};
player=null; villainKills=0;
state='title';
loop();
</script>
